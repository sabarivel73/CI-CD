version: 0.2
phases:
  pre_build:
    commands:
#      - mvn clean test
#      - mvn clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar "-Dsonar.projectKey=project_key" "-Dsonar.projectName='project_name'" "-Dsonar.host.url=http://sonarqube_host:9000" "-Dsonar.token=sonarqube_token"
      - mvn clean package
      - echo now login into AWS ECR
      - REPOSITORY_URI=696263047337.dkr.ecr.ap-south-1.amazonaws.com/backend
      - aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin $REPOSITORY_URI
      - IMAGE_TAG=build-$(echo $CODEBUILD_BUILD_ID | awk -F":" '{print $2}')
  build:
    commands:
      - echo now building the docker image
      - docker build -t backend:latest .
#      - docker tag $REPOSITORY_URI:latest $REPOSITORY_URI:$IMAGE_TAG
  post_build:
    commands:
      - echo now push build image to ECR
      - docker push $REPOSITORY_URI:latest
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - printf '[{"name":"sample_cicd","imageUri":"%s"}]' $REPOSITORY_URI:$IMAGE_TAG > imagedefinitions.json
      - cat imagedefinitions.json
#reports:
#  junit-reports:
#    files:
#      - target/surefire-reports/*.xml
#    file-format: JUNITXML
artifacts:
  files:
    - imagedefinitions.json